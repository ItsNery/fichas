name: Deploy

on:
  push:
    branches:
      - beta
      - main

jobs:
  deploy-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: [self-hosted, pimrep]

    steps:
      - name: Deploy BETA
        run: |
          set -euo pipefail

          cd /var/www/html/betafichas
          backup_dir="/var/backups/fichas_municipales/beta"
          backup_file="$backup_dir/fichas-$(date +%Y%m%d-%H%M%S).sql.gz"
          mysql_defaults="$(mktemp)"
          trap 'rm -f "$mysql_defaults"' EXIT

          sudo install -d -m 0750 -o user_planeacion -g www-data "$backup_dir"
          database_name="$(php -r '
            require "vendor/autoload.php";
            $env = Dotenv\Dotenv::createImmutable(__DIR__)->load();
            if (($env["DB_CONNECTION"] ?? "mysql") !== "mysql") { fwrite(STDERR, "El respaldo de despliegue requiere una conexión MySQL.\n"); exit(1); }
            $quote = static function ($value): string { return "\"" . str_replace(["\\", "\""], ["\\\\", "\\\""], $value) . "\""; };
            file_put_contents($argv[1], "[client]\n" . "host=" . $quote($env["DB_HOST"] ?? "127.0.0.1") . "\n" . "port=" . $quote($env["DB_PORT"] ?? "3306") . "\n" . "user=" . $quote($env["DB_USERNAME"] ?? "") . "\n" . "password=" . $quote($env["DB_PASSWORD"] ?? "") . "\n");
            echo $env["DB_DATABASE"] ?? "";
          ' "$mysql_defaults")"
          chmod 600 "$mysql_defaults"
          test -n "$database_name"
          mysqldump --defaults-extra-file="$mysql_defaults" --single-transaction --routines --events --triggers --hex-blob --add-drop-table --databases "$database_name" | gzip > "$backup_file"
          gzip -t "$backup_file"
          test -s "$backup_file"

          git fetch origin
          git reset --hard origin/beta
          test -f public/img/fondos/Fondo-hero.webp
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          sudo chown -R user_planeacion:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache

          npm ci
          npm run build

          composer install --no-dev --optimize-autoloader

          php artisan migrate --force

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan route:clear
          php artisan storage:link

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, pimrep]

    steps:
      - name: Deploy PRODUCCION
        run: |
          set -euo pipefail

          cd /var/www/html/fichas
          backup_dir="/var/backups/fichas_municipales/produccion"
          backup_file="$backup_dir/fichas-$(date +%Y%m%d-%H%M%S).sql.gz"
          mysql_defaults="$(mktemp)"
          trap 'rm -f "$mysql_defaults"' EXIT

          sudo install -d -m 0750 -o user_planeacion -g www-data "$backup_dir"
          database_name="$(php -r '
            require "vendor/autoload.php";
            $env = Dotenv\Dotenv::createImmutable(__DIR__)->load();
            if (($env["DB_CONNECTION"] ?? "mysql") !== "mysql") { fwrite(STDERR, "El respaldo de despliegue requiere una conexión MySQL.\n"); exit(1); }
            $quote = static function ($value): string { return "\"" . str_replace(["\\", "\""], ["\\\\", "\\\""], $value) . "\""; };
            file_put_contents($argv[1], "[client]\n" . "host=" . $quote($env["DB_HOST"] ?? "127.0.0.1") . "\n" . "port=" . $quote($env["DB_PORT"] ?? "3306") . "\n" . "user=" . $quote($env["DB_USERNAME"] ?? "") . "\n" . "password=" . $quote($env["DB_PASSWORD"] ?? "") . "\n");
            echo $env["DB_DATABASE"] ?? "";
          ' "$mysql_defaults")"
          chmod 600 "$mysql_defaults"
          test -n "$database_name"
          mysqldump --defaults-extra-file="$mysql_defaults" --single-transaction --routines --events --triggers --hex-blob --add-drop-table --databases "$database_name" | gzip > "$backup_file"
          gzip -t "$backup_file"
          test -s "$backup_file"

          git fetch origin
          git reset --hard origin/main
          test -f public/img/fondos/Fondo-hero.webp
          sudo chown -R user_planeacion:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache
          sudo chmod -R g+s storage bootstrap/cache
          npm ci
          npm run build

          composer install --no-dev --optimize-autoloader

          php artisan migrate --force

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan storage:link


